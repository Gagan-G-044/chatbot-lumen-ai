<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumen — AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script>
const themeStorageKey = 'lumen-theme';

function applyTheme(theme) {
  const root = document.documentElement;
  const body = document.body;

  root.setAttribute('data-theme', theme);
  root.style.colorScheme = theme;

  if (theme === 'light') {
    root.classList.remove('dark');
    root.classList.add('light');
    if (body) {
      body.classList.remove('dark');
      body.classList.add('light');
    }
    root.style.background = 'radial-gradient(130% 90% at 50% -10%, #bae6fd 0%, #e0f2fe 35%, #f0f9ff 70%, #f8fafc 100%) fixed';
  } else {
    root.classList.remove('light');
    root.classList.add('dark');
    if (body) {
      body.classList.remove('light');
      body.classList.add('dark');
    }
    root.style.background = 'radial-gradient(130% 90% at 50% -10%, #0e2246 0%, #071224 35%, #030713 70%, #02040a 100%) fixed';
  }

  try {
    localStorage.setItem(themeStorageKey, theme);
  } catch (e) {}

  const cb = document.getElementById('theme-checkbox');
  if (cb) {
    cb.checked = (theme === 'light');
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'light' ? 'dark' : 'light');
}

function initTheme() {
  let saved = null;
  try {
    saved = localStorage.getItem(themeStorageKey);
  } catch (e) {}
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  const initialTheme = saved ? saved : (prefersLight ? 'light' : 'dark');
  applyTheme(initialTheme);
}

// Apply immediately on parse to avoid flash
initTheme();
</script>
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS & SURFACES
═══════════════════════════════════════════ */
:root {
  /* Core Sky Palette */
  --sky:            #38bdf8;
  --sky-mid:        #0ea5e9;
  --sky-deep:       #0284c7;
  --sky-glow:       rgba(56, 189, 248, 0.26);
  --sky-glow2:      rgba(14, 165, 233, 0.14);
  --accent-grad:    linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
  --accent-glow:    rgba(56, 189, 248, 0.28);
  --accent-glow2:   rgba(14, 165, 233, 0.16);

  /* Border Beam Tokens */
  --beam-size:        240px;
  --beam-duration:    6s;
  --beam-width:       1.5px;
  --beam-color-from:  var(--sky, #38bdf8);
  --beam-color-to:    var(--sky-deep, #0284c7);
  --beam-glow:        rgba(56, 189, 248, 0.35);

  /* Typography */
  --f-display: 'Cormorant Garamond', 'Palatino Linotype', Georgia, serif;
  --f-ui:      'DM Sans', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;

  /* Radii */
  --r-xs:  6px;
  --r-sm:  10px;
  --r-md:  14px;
  --r-lg:  18px;
  --r-xl:  22px;
  --r-2xl: 30px;

  /* Layout */
  --chat-max: 860px;

  /* Motion */
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --t:    180ms;
  --t-lg: 320ms;

  /* Dark Theme Surfaces (Default) */
  --bg-gradient: radial-gradient(130% 90% at 50% -10%, #0e2246 0%, #071224 35%, #030713 70%, #02040a 100%);
  --topbar-bg:   rgba(6, 12, 24, 0.55);
  --topbar-blur: blur(20px) saturate(1.4);
  --stroke:      rgba(255, 255, 255, 0.08);
  --stroke-h:    rgba(255, 255, 255, 0.16);
  --stroke-acc:  rgba(56, 189, 248, 0.4);

  --txt-0: rgba(255, 255, 255, 0.95);
  --txt-1: rgba(255, 255, 255, 0.72);
  --txt-2: rgba(255, 255, 255, 0.45);
  --txt-3: rgba(255, 255, 255, 0.25);

  --input-bar-bg:      rgba(11, 18, 32, 0.78);
  --input-bar-border:  rgba(255, 255, 255, 0.09);
  --input-bar-focus:   rgba(56, 189, 248, 0.5);

  --bub-ai-bg:         rgba(13, 20, 35, 0.72);
  --bub-ai-border:     rgba(255, 255, 255, 0.08);
  --bub-ai-color:      rgba(255, 255, 255, 0.95);

  --bub-err-bg:        rgba(239, 68, 68, 0.09);
  --bub-err-border:    rgba(239, 68, 68, 0.25);
  --bub-err-color:     rgba(252, 165, 165, 0.95);

  --chip-bg:           rgba(255, 255, 255, 0.045);
  --chip-border:       rgba(255, 255, 255, 0.08);
  --chip-color:        rgba(255, 255, 255, 0.75);
  --chip-hover-bg:     rgba(56, 189, 248, 0.12);
  --chip-hover-border: rgba(56, 189, 248, 0.35);
  --chip-hover-color:  rgba(186, 230, 253, 0.98);

  --status-bg:         rgba(52, 211, 153, 0.08);
  --status-border:     rgba(52, 211, 153, 0.22);
  --status-color:      rgba(110, 231, 183, 0.92);

  --btn-topbar-bg:           rgba(255, 255, 255, 0.045);
  --btn-topbar-border:       rgba(255, 255, 255, 0.09);
  --btn-topbar-color:        rgba(255, 255, 255, 0.75);
  --btn-topbar-hover-bg:     rgba(56, 189, 248, 0.12);
  --btn-topbar-hover-border: rgba(56, 189, 248, 0.32);
  --btn-topbar-hover-color:  rgba(255, 255, 255, 0.95);

  --code-bg:           rgba(5, 10, 20, 0.72);
  --code-border:       rgba(255, 255, 255, 0.09);
  --code-color:        #e2e8f0;
  --inline-code-bg:    rgba(56, 189, 248, 0.09);
  --inline-code-border:rgba(56, 189, 248, 0.2);
  --inline-code-color: rgba(186, 230, 253, 0.95);
}

/* ═══════════════════════════════════════════
   LIGHT THEME (HIGH CONTRAST & HARMONIOUS)
═══════════════════════════════════════════ */
:root[data-theme="light"], html.light, html[data-theme="light"] {
  --bg-gradient: radial-gradient(130% 90% at 50% -10%, #bae6fd 0%, #e0f2fe 35%, #f0f9ff 70%, #f8fafc 100%);
  --topbar-bg:   rgba(240, 249, 255, 0.75);
  --topbar-blur: blur(20px) saturate(1.4);
  --stroke:      rgba(14, 165, 233, 0.15);
  --stroke-h:    rgba(14, 165, 233, 0.28);
  --stroke-acc:  rgba(14, 165, 233, 0.45);

  --txt-0: #0a192f;
  --txt-1: #1e3a5f;
  --txt-2: #334155;
  --txt-3: #64748b;

  --input-bar-bg:      rgba(255, 255, 255, 0.90);
  --input-bar-border:  rgba(14, 165, 233, 0.24);
  --input-bar-focus:   rgba(14, 165, 233, 0.65);

  --bub-ai-bg:         rgba(255, 255, 255, 0.92);
  --bub-ai-border:     rgba(14, 165, 233, 0.2);
  --bub-ai-color:      #0a192f;

  --bub-err-bg:        rgba(239, 68, 68, 0.08);
  --bub-err-border:    rgba(239, 68, 68, 0.22);
  --bub-err-color:     #b91c1c;

  --chip-bg:           rgba(255, 255, 255, 0.78);
  --chip-border:       rgba(14, 165, 233, 0.22);
  --chip-color:        #1e3a5f;
  --chip-hover-bg:     rgba(255, 255, 255, 0.98);
  --chip-hover-border: rgba(14, 165, 233, 0.48);
  --chip-hover-color:  #0284c7;

  --status-bg:         rgba(16, 185, 129, 0.1);
  --status-border:     rgba(16, 185, 129, 0.25);
  --status-color:      #047857;

  --btn-topbar-bg:           rgba(255, 255, 255, 0.75);
  --btn-topbar-border:       rgba(14, 165, 233, 0.22);
  --btn-topbar-color:        #0c1a2e;
  --btn-topbar-hover-bg:     rgba(255, 255, 255, 0.98);
  --btn-topbar-hover-border: rgba(14, 165, 233, 0.45);
  --btn-topbar-hover-color:  #0284c7;

  --code-bg:           #0f172a;
  --code-border:       rgba(14, 165, 233, 0.16);
  --code-color:        #f8fafc;
  --inline-code-bg:    rgba(14, 165, 233, 0.1);
  --inline-code-border:rgba(14, 165, 233, 0.24);
  --inline-code-color: #0284c7;

  /* Border Beam Light Tokens */
  --beam-color-from:  #0284c7;
  --beam-color-to:    #38bdf8;
  --beam-glow:        rgba(14, 165, 233, 0.4);
}

/* ═══════════════════════════════════════════
   RESET & FULL VIEWPORT ROOT
═══════════════════════════════════════════ */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  height: 100%;
  width: 100%;
  color-scheme: dark;
  background: var(--bg-gradient);
  background-attachment: fixed;
  transition: background 300ms ease;
}

html[data-theme="light"], html.light {
  color-scheme: light;
}

body {
  height: 100%;
  width: 100%;
  font-family: var(--f-ui);
  font-size: 14px;
  line-height: 1.6;
  color: var(--txt-0);
  background: transparent;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: color var(--t);
}

/* ═══════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.18); border-radius: 99px; transition: background var(--t); }
::-webkit-scrollbar-thumb:hover { background: rgba(56,189,248,0.45); }

/* ═══════════════════════════════════════════
   FULL-SCREEN TOPO WEBGL & AMBIENT GLOW
═══════════════════════════════════════════ */
#topo-bg {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 0;
}

#topo-canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Dark mode soft radial vignette for depth */
#topo-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 95% 85% at 50% 40%, transparent 40%, rgba(2, 5, 12, 0.45) 100%);
  pointer-events: none;
  transition: opacity 300ms ease;
}

html[data-theme="light"] #topo-bg::after,
html.light #topo-bg::after {
  opacity: 0;
}

/* Ambient glow orbs */
.ambient {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  overflow: hidden;
}

.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(140px);
  pointer-events: none;
}

.orb-1 {
  width: 800px;
  height: 800px;
  top: -240px;
  left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(56, 189, 248, 0.22), transparent 70%);
  animation: orbFloat1 26s ease-in-out infinite alternate;
}

.orb-2 {
  width: 500px;
  height: 500px;
  bottom: -120px;
  right: -60px;
  background: radial-gradient(circle, rgba(14, 165, 233, 0.16), transparent 70%);
  animation: orbFloat2 32s ease-in-out infinite alternate;
}

html[data-theme="light"] .orb-1,
html.light .orb-1 {
  background: radial-gradient(circle, rgba(56, 189, 248, 0.15), transparent 70%);
}

html[data-theme="light"] .orb-2,
html.light .orb-2 {
  background: radial-gradient(circle, rgba(14, 165, 233, 0.12), transparent 70%);
}

@keyframes orbFloat1 {
  from { transform: translate(-50%, 0) scale(1); }
  to   { transform: translate(calc(-50% - 50px), 60px) scale(1.12); }
}

@keyframes orbFloat2 {
  from { transform: translate(0, 0) scale(1); }
  to   { transform: translate(40px, -60px) scale(1.16); }
}

/* ═══════════════════════════════════════════
   FULL-WIDTH APP SHELL (NO DEAD GUTTERS)
═══════════════════════════════════════════ */
.app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* ═══════════════════════════════════════════
   SEAMLESS TOPBAR (FULL WIDTH HEADER)
═══════════════════════════════════════════ */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 32px;
  background: var(--topbar-bg);
  backdrop-filter: var(--topbar-blur);
  -webkit-backdrop-filter: var(--topbar-blur);
  border-bottom: 1px solid var(--stroke);
  transition: background var(--t-lg), border-color var(--t-lg);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  user-select: none;
  text-decoration: none;
}

.logo-gem {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: var(--accent-grad);
  box-shadow: 0 0 16px var(--accent-glow), 0 0 32px var(--accent-glow2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}

.logo-gem::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(145deg, rgba(255,255,255,0.25) 0%, transparent 60%);
}

.logo-gem svg {
  width: 15px;
  height: 15px;
  color: #ffffff;
  position: relative;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
}

.brand-title-row {
  display: flex;
  align-items: center;
  gap: 7px;
}

.brand-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.3px;
  color: var(--txt-0);
}

.brand-badge {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(56, 189, 248, 0.15);
  border: 1px solid rgba(56, 189, 248, 0.3);
  color: var(--sky-deep);
}

html[data-theme="dark"] .brand-badge,
:root:not([data-theme="light"]) .brand-badge {
  color: #7dd3fc;
}

.brand-sub {
  font-family: var(--f-display);
  font-style: italic;
  font-size: 11px;
  font-weight: 300;
  color: var(--txt-2);
  letter-spacing: 0.02em;
  margin-top: 1px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Action button (e.g. New chat) */
.topbar-action-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 13px;
  background: var(--btn-topbar-bg);
  border: 1px solid var(--btn-topbar-border);
  border-radius: var(--r-md);
  color: var(--btn-topbar-color);
  font-family: var(--f-ui);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  letter-spacing: -0.1px;
  transition: all var(--t) var(--ease);
}

.topbar-action-btn:hover {
  background: var(--btn-topbar-hover-bg);
  border-color: var(--btn-topbar-hover-border);
  color: var(--btn-topbar-hover-color);
  box-shadow: 0 0 16px var(--accent-glow);
  transform: translateY(-1px);
}

.topbar-action-btn svg {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

/* Icon button (e.g. Clear) */
.topbar-icon-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--r-sm);
  background: var(--btn-topbar-bg);
  border: 1px solid var(--btn-topbar-border);
  color: var(--txt-2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--t) var(--ease);
}

.topbar-icon-btn:hover {
  background: var(--btn-topbar-hover-bg);
  border-color: var(--btn-topbar-hover-border);
  color: var(--txt-0);
  box-shadow: 0 0 12px var(--accent-glow);
}

.topbar-icon-btn svg {
  width: 14px;
  height: 14px;
}

.topbar-divider {
  width: 1px;
  height: 18px;
  background: var(--stroke);
}

/* Online Status Pill */
.status {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  background: var(--status-bg);
  border: 1px solid var(--status-border);
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--status-color);
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.7);
  animation: statusPulse 2.4s ease-in-out infinite;
}

@keyframes statusPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.8); }
}

/* ═══════════════════════════════════════════
   THEME TOGGLE SLIDER
═══════════════════════════════════════════ */
.theme-switch {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
  position: relative;
  user-select: none;
}

.theme-switch input[type="checkbox"] {
  position: absolute;
  opacity: 0;
  width: 0;
  height: 0;
  pointer-events: none;
}

.theme-switch-track {
  width: 46px;
  height: 25px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--stroke-h);
  border-radius: 99px;
  position: relative;
  transition: background var(--t-lg) var(--ease), border-color var(--t-lg) var(--ease), box-shadow var(--t-lg);
  display: block;
}

html[data-theme="light"] .theme-switch-track,
html.light .theme-switch-track {
  background: rgba(14, 165, 233, 0.16);
  border-color: rgba(14, 165, 233, 0.38);
}

.theme-switch:hover .theme-switch-track {
  border-color: var(--sky);
  box-shadow: 0 0 12px var(--accent-glow);
}

.theme-switch-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 19px;
  height: 19px;
  border-radius: 50%;
  background: var(--accent-grad);
  box-shadow: 0 0 10px var(--accent-glow), 0 1px 3px rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform var(--t-lg) var(--ease), background var(--t-lg) var(--ease), box-shadow var(--t-lg);
}

/* Checked state = Light mode */
.theme-switch input:checked ~ .theme-switch-track .theme-switch-thumb {
  transform: translateX(21px);
  box-shadow: 0 0 14px rgba(245, 158, 11, 0.5), 0 1px 3px rgba(0, 0, 0, 0.18);
  background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
}

.theme-switch-thumb svg {
  width: 10px;
  height: 10px;
  color: #ffffff;
}

.icon-sun  { display: none; }
.icon-moon { display: block; }

.theme-switch input:checked ~ .theme-switch-track .theme-switch-thumb .icon-sun  { display: block; }
.theme-switch input:checked ~ .theme-switch-track .theme-switch-thumb .icon-moon { display: none; }

/* ═══════════════════════════════════════════
   MAIN CHAT CONTAINER (FULL-WIDTH EXPANSION)
═══════════════════════════════════════════ */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  width: 100%;
  height: calc(100vh - 61px);
  position: relative;
  background: transparent;
}

.scroll-area {
  flex: 1;
  overflow-y: auto;
  position: relative;
  z-index: 1;
  width: 100%;
}

.messages {
  max-width: var(--chat-max);
  margin: 0 auto;
  padding: 36px 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
}

/* ── Empty State ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 68px 24px 32px;
  animation: fadeUp 0.8s var(--ease) both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.empty-gem {
  width: 60px;
  height: 60px;
  border-radius: 18px;
  background: var(--accent-grad);
  box-shadow: 0 0 32px var(--accent-glow), 0 0 64px var(--accent-glow2),
              0 1px 0 rgba(255,255,255,0.2) inset;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 26px;
  position: relative;
  overflow: hidden;
}

.empty-gem::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(145deg, rgba(255,255,255,0.25) 0%, transparent 60%);
}

.empty-gem svg {
  width: 28px;
  height: 28px;
  color: #ffffff;
  position: relative;
}

.empty-h {
  font-family: var(--f-display);
  font-size: 38px;
  font-weight: 400;
  letter-spacing: -0.4px;
  line-height: 1.15;
  color: var(--txt-0);
  margin-bottom: 12px;
}

.empty-h em {
  font-style: italic;
  background: linear-gradient(100deg, #38bdf8 0%, #0284c7 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

html[data-theme="light"] .empty-h em,
html.light .empty-h em {
  background: linear-gradient(100deg, #0284c7 0%, #0369a1 100%);
  -webkit-background-clip: text;

/* ═══════════════════════════════════════════
   MAGIC UI BORDER BEAM EFFECT
═══════════════════════════════════════════ */
border-beam {
  display: contents;
  pointer-events: none;
}

.border-beam-container {
  pointer-events: none;
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: var(--border-beam-width, var(--beam-width, 1.5px));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite: exclude;
  overflow: hidden;
  z-index: 1;
}

.border-beam-line {
  position: absolute;
  aspect-ratio: 1;
  width: var(--border-beam-size, var(--beam-size, 240px));
  background: linear-gradient(
    to left,
    var(--border-beam-color-from, var(--beam-color-from, #38bdf8)),
    var(--border-beam-color-to, var(--beam-color-to, #0284c7)),
    transparent
  );
  offset-path: rect(0 auto auto 0 round var(--border-beam-size, var(--beam-size, 240px)));
  animation: border-beam-travel var(--border-beam-duration, var(--beam-duration, 6s)) linear infinite;
  animation-delay: var(--border-beam-delay, 0s);
  filter: drop-shadow(0 0 8px var(--border-beam-glow, var(--beam-glow, rgba(56, 189, 248, 0.35))));
}

.border-beam-line.reverse {
  animation-direction: reverse;
}

@keyframes border-beam-travel {
  0% {
    offset-distance: 0%;
  }
  100% {
    offset-distance: 100%;
  }
}

/* Fallback for browsers without CSS offset-path: rect() */
@supports not (offset-path: rect(0 auto auto 0 round 10px)) {
  .border-beam-line {
    inset: -150%;
    width: auto;
    aspect-ratio: auto;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 280deg,
      var(--border-beam-color-to, var(--beam-color-to, #0284c7)) 325deg,
      var(--border-beam-color-from, var(--beam-color-from, #38bdf8)) 360deg
    );
    animation: border-beam-rotate var(--border-beam-duration, var(--beam-duration, 6s)) linear infinite;
  }
  .border-beam-line.reverse {
    animation-direction: reverse;
  }
  @keyframes border-beam-rotate {
    to {
      transform: rotate(360deg);
    }
  }
}

<script>
/* ═══════════════════════════════════════════
   MAGIC UI BORDER BEAM WEB COMPONENT & HELPER
═══════════════════════════════════════════ */
class BorderBeamElement extends HTMLElement {
  connectedCallback() {
    if (this.querySelector('.border-beam-container')) return;

    const size = this.getAttribute('size') || '240';
    const duration = this.getAttribute('duration') || '6';
    const borderWidth = this.getAttribute('border-width') || '1.5';
    const colorFrom = this.getAttribute('color-from');
    const colorTo = this.getAttribute('color-to');
    const reverse = this.hasAttribute('reverse') && this.getAttribute('reverse') !== 'false';
    const delay = this.getAttribute('delay') || '0';

    const container = document.createElement('div');
    container.className = 'border-beam-container';
    container.setAttribute('aria-hidden', 'true');
    if (borderWidth) container.style.setProperty('--border-beam-width', `${borderWidth}px`);

    const line = document.createElement('div');
    line.className = `border-beam-line${reverse ? ' reverse' : ''}`;
    if (size) line.style.setProperty('--border-beam-size', `${size}px`);
    if (duration) line.style.setProperty('--border-beam-duration', `${duration}s`);
    if (delay) line.style.setProperty('--border-beam-delay', `${delay}s`);
    if (colorFrom) line.style.setProperty('--border-beam-color-from', colorFrom);
    if (colorTo) line.style.setProperty('--border-beam-color-to', colorTo);

    container.appendChild(line);
    this.appendChild(container);
  }
}
if (!customElements.get('border-beam')) {
  customElements.define('border-beam', BorderBeamElement);
}

function createBorderBeam(container, options = {}) {
  const el = document.createElement('border-beam');
  if (options.size) el.setAttribute('size', options.size);
  if (options.duration) el.setAttribute('duration', options.duration);
  if (options.borderWidth) el.setAttribute('border-width', options.borderWidth);
  if (options.colorFrom) el.setAttribute('color-from', options.colorFrom);
  if (options.colorTo) el.setAttribute('color-to', options.colorTo);
  if (options.reverse) el.setAttribute('reverse', '');
  if (options.delay) el.setAttribute('delay', options.delay);
  container.appendChild(el);
  return el;
}

/* ── Configuration ── */
const API = '/chat';

/* ── State ── */
let busy = false;
let chatHistory = [];

/* ── DOM References ── */
const $ = id => document.getElementById(id);
const msgsEl    = $('messages');
const scrollEl  = $('scroll-area');
const inpEl     = $('inp');
const sendBtnEl = $('send-btn');
const themeCb   = $('theme-checkbox');

/* ── Textarea Autogrow ── */
inpEl.addEventListener('input', () => {
  inpEl.style.height = 'auto';
  inpEl.style.height = Math.min(inpEl.scrollHeight, 150) + 'px';
});

/* ── Keyboard Shortcuts (Enter / Shift+Enter) ── */
inpEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!busy) sendMsg();
  }
});

/* ── Scroll Helper ── */
function scrollBottom() {
  requestAnimationFrame(() => {
    scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: 'smooth' });
  });
}

/* ── Utility Helpers ── */
const now = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

function esc(s) {
  return s.replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
}

function dismissEmpty() {
  const el = $('empty-state');
  if (el) el.remove();
}

/* ── Message Renderer ── */
function renderMsg(role, text, isErr = false) {
  dismissEmpty();
  const isUser = role === 'user';

  const row = document.createElement('div');
  row.className = `msg-row ${isUser ? 'user' : 'ai'}`;

  // Avatar
  const av = document.createElement('div');
  av.className = `av ${isUser ? 'av-user' : 'av-ai'}`;
  if (isUser) {
    av.textContent = 'U';
  } else {
    av.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`;
  }

  // Column
  const col = document.createElement('div');
  col.className = 'bub-col';

  // Bubble
  const bub = document.createElement('div');
  const bubClass = isUser ? 'bub-user' : (isErr ? 'bub-err' : 'bub-ai');
  bub.className = `bub ${bubClass}`;

  // Render markdown for AI, escaped text for user
  if (!isUser && !isErr && typeof marked !== 'undefined') {
    bub.innerHTML = `<div class="md-body">${marked.parse(text)}</div>`;
  } else {
    bub.innerHTML = esc(text).replace(/\n/g, '<br>');
  }

  // Copy button for AI replies
  if (!isUser && !isErr) {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
        <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
      </svg>Copy`;
    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.classList.add('copied');
        copyBtn.innerHTML = `
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>Copied!`;
        setTimeout(() => {
          copyBtn.classList.remove('copied');
          copyBtn.innerHTML = `
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
            </svg>Copy`;
        }, 2000);
      }).catch(() => {});
    });
    bub.appendChild(copyBtn);
  }

  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = now();

  col.appendChild(bub);
  col.appendChild(ts);
  row.appendChild(av);
  row.appendChild(col);
  msgsEl.appendChild(row);
  scrollBottom();
}

/* ── Typing Indicator ── */
function showTyping() {
  const row = document.createElement('div');
  row.id = 'typing';
  row.className = 'typing-row';

  const av = document.createElement('div');
  av.className = 'av av-ai';
  av.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>`;

  const bub = document.createElement('div');
  bub.className = 'typing-bub';
  bub.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';

  row.appendChild(av);
  row.appendChild(bub);
  msgsEl.appendChild(row);
  scrollBottom();
}

function hideTyping() {
  const el = $('typing');
  if (el) el.remove();
}

/* ── Loading State ── */
function setLoading(state) {
  busy = state;
  sendBtnEl.disabled = state;
  inpEl.disabled = state;
}

/* ── Send Message ── */
async function sendMsg() {
  const text = inpEl.value.trim();
  if (!text || busy) return;

  inpEl.value = '';
  inpEl.style.height = 'auto';

  renderMsg('user', text);
  chatHistory.push({ role: 'user', content: text });

  setLoading(true);
  showTyping();

  try {
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });

    hideTyping();
    if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
    const data = await res.json();
    if (!data.reply) throw new Error('Missing "reply" in server response');

    renderMsg('ai', data.reply);
    chatHistory.push({ role: 'assistant', content: data.reply });

  } catch(err) {
    hideTyping();
    const msg = err.message.includes('fetch')
      ? 'Cannot connect to server. Is it running?'
      : err.message;
    renderMsg('ai', '⚠ ' + msg, true);
  } finally {
    setLoading(false);
    inpEl.focus();
  }
}

/* ── Suggestion Click ── */
function suggest(text) {
  inpEl.value = text;
  inpEl.style.height = 'auto';
  inpEl.style.height = Math.min(inpEl.scrollHeight, 150) + 'px';
  sendMsg();
}

/* ── New Chat / Clear Conversation ── */
function newChat() {
  chatHistory = [];
  msgsEl.innerHTML = '';

  const empty = document.createElement('div');
  empty.id = 'empty-state';
  empty.className = 'empty';
  empty.innerHTML = `
    <div class="empty-gem">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h1 class="empty-h">Ask <em>anything.</em></h1>
    <p class="empty-p">Deep reasoning, precise writing, creative thinking — built for engineers and creators who demand more.</p>
    <div class="chips">
      <div class="chip" onclick="suggest('Explain the CAP theorem in distributed systems')">CAP theorem</div>
      <div class="chip" onclick="suggest('Write a cinematic short story about solitude on Mars')">Story about Mars</div>
      <div class="chip" onclick="suggest('Best practices for a production Node.js REST API')">Node.js API</div>
      <div class="chip" onclick="suggest('Design a 6-day PPL hypertrophy workout split')">Hypertrophy plan</div>
      <div class="chip" onclick="suggest('How does transformer attention mechanism work?')">Transformers explained</div>
    </div>`;
  msgsEl.appendChild(empty);
  inpEl.focus();
}

/* ── Page Load Initialization ── */
window.addEventListener('DOMContentLoaded', () => {
  initTheme();
  inpEl.focus();
});
</script>

<!-- ═══════════════════════════════════════════════════════════
     TOPO FIELD — WebGL Background
     48px physical grid + animated simplex-noise topographic lines
════════════════════════════════════════════════════════════ -->
<script>
(function () {
  const canvas = document.getElementById('topo-canvas');
  if (!canvas) return;

  const gl = canvas.getContext('webgl', { alpha: true, antialias: true, depth: false });
  if (!gl) return;

  // Vertex shader
  const vsSource = `
    attribute vec2 a_position;
    void main() { gl_Position = vec4(a_position, 0.0, 1.0); }
  `;

  // Fragment shader: rendered with alpha blending across dark and light palettes
  const fsSource = `
    precision highp float;
    uniform vec2  u_resolution;
    uniform float u_time;
    uniform float u_dpr;
    uniform float u_light;   /* 0.0 = dark, 1.0 = light */

    vec3 permute(vec3 x) { return mod(((x * 34.0) + 1.0) * x, 289.0); }
    float snoise(vec2 v) {
      const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                         -0.577350269189626, 0.024390243902439);
      vec2 i  = floor(v + dot(v, C.yy));
      vec2 x0 = v - i + dot(i, C.xx);
      vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
      vec4 x12 = x0.xyxy + C.xxzz;
      x12.xy -= i1;
      i = mod(i, 289.0);
      vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0))
                             + i.x + vec3(0.0, i1.x, 1.0));
      vec3 m = max(0.5 - vec3(dot(x0,x0),
                               dot(x12.xy, x12.xy),
                               dot(x12.zw, x12.zw)), 0.0);
      m = m * m; m = m * m;
      vec3 x2 = 2.0 * fract(p * C.www) - 1.0;
      vec3 h  = abs(x2) - 0.5;
      vec3 ox = floor(x2 + 0.5);
      vec3 a0 = x2 - ox;
      m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
      vec3 g;
      g.x  = a0.x  * x0.x   + h.x  * x0.y;
      g.yz = a0.yz * x12.xz + h.yz * x12.yw;
      return 130.0 * dot(m, g);
    }

    void main() {
      vec2 st = gl_FragCoord.xy / u_resolution.xy;
      st.x *= u_resolution.x / u_resolution.y;

      /* 1-px physical grid lines */
      float gridSize  = 48.0 * u_dpr;
      vec2  gridFract = fract(gl_FragCoord.xy / gridSize);
      float lineW     = 1.0 / gridSize;
      float gridLines = clamp(
        step(1.0 - lineW, gridFract.x) + step(1.0 - lineW, gridFract.y),
        0.0, 1.0
      );

      /* Topographic contours */
      float noiseScale = 1.35;
      vec2  noisePos   = st * noiseScale + vec2(u_time * 0.012, u_time * 0.020);
      float n          = snoise(noisePos) * 0.5 + 0.5;
      float bandVal    = n * 9.5;
      float triWave    = abs(fract(bandVal) - 0.5) * 2.0;

      float gL = gridLines;
      float tL = smoothstep(0.025, 0.00, triWave);

      /* Dark mode: glowing sky cyan lines floating over cosmic gradient */
      vec3 darkLineColor = vec3(0.22, 0.74, 0.98); /* Sky-blue #38bdf8 */
      float darkAlpha = (gL * 0.08) + (tL * 0.28);

      /* Light mode: crisp deep azure lines floating over bright sky gradient */
      vec3 lightLineColor = vec3(0.02, 0.42, 0.68); /* #056cb0 */
      float lightAlpha = (gL * 0.07) + (tL * 0.24);

      vec3 lineColor  = mix(darkLineColor, lightLineColor, u_light);
      float lineAlpha = mix(darkAlpha, lightAlpha, u_light);

      /* Premultiplied alpha output */
      gl_FragColor = vec4(lineColor * lineAlpha, lineAlpha);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.warn('[TopoField] Shader error:', gl.getShaderInfoLog(s));
    }
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER,   vsSource));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  // Full-screen quad geometry
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);

  // Alpha blending configuration
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

  // Uniform locations
  const uRes   = gl.getUniformLocation(prog, 'u_resolution');
  const uTime  = gl.getUniformLocation(prog, 'u_time');
  const uDpr   = gl.getUniformLocation(prog, 'u_dpr');
  const uLight = gl.getUniformLocation(prog, 'u_light');

  let lightVal = 0.0;
  let targetLight = 0.0;
  let lightAnimId = null;

  function setLightMode(isLight) {
    targetLight = isLight ? 1.0 : 0.0;
    if (lightAnimId) cancelAnimationFrame(lightAnimId);
    function step() {
      lightVal += (targetLight - lightVal) * 0.1;
      if (Math.abs(targetLight - lightVal) < 0.002) {
        lightVal = targetLight;
      } else {
        lightAnimId = requestAnimationFrame(step);
      }
    }
    step();
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width  = window.innerWidth  * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uDpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  const t0 = performance.now();
  function render(now) {
    gl.clearColor(0.0, 0.0, 0.0, 0.0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    gl.uniform1f(uTime, (now - t0) * 0.001);
    gl.uniform1f(uLight, lightVal);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);

  // Observe theme changes on <html>
  const htmlRoot = document.documentElement;
  function syncTheme() {
    const isLight = htmlRoot.getAttribute('data-theme') === 'light' || htmlRoot.classList.contains('light');
    setLightMode(isLight);
  }

  new MutationObserver(syncTheme).observe(htmlRoot, {
    attributes: true,
    attributeFilter: ['data-theme', 'class']
  });
  syncTheme();
})();
</script>
